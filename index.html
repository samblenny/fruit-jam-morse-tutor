<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morse Tutor</title>
<style>
:root{
color-scheme:light dark; /* use browser defaults for system darkmode setting */
--F: #ffdcec; --B: #1d1d1d; --H: #25c3c0; --L: #459cda; --O: #aaa;
--BTN: #054407;
}
@media (prefers-color-scheme: light){
 :root{--F: #101010; --B: #f5f5f5; --H: #313131; --L: #3f40f9; --O: #444;
        --BTN: #3dff4d;}
}
html{-webkit-text-size-adjust:none;font-size:14pt;font-family: sans-serif;}
main{margin:0 auto;max-width:700px;}
#connect{float: right; background: var(--BTN); font-size: 24px; padding: 10px;
 border-radius: 13px; border: 2px solid var(--H);}
#connect.mute{ background: var(--B); color: var(--F); font-size: 18px; }

</style>
</head>
<body>
<main>

<h1>Morse Tutor</h1>

<button id="connect">Connect</button>

<p>Serial Port: <span id="status">[no connection]</span></p>

<p>This is some placeholder text and a <a href="#">link</a> to nothing.</p>

<script type="module" src="main.js"></script>

</main>
</body>
</html>
